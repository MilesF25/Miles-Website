<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles Franck | Hub</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>


    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>


    <div id="navbar"></div>
    <!-- Blog Hub Content -->
    <div class="blog-hub-container">

        <div class="blog-hub-header">
            <h1>Blog Hub</h1>
            <p>See what I'm up to</p>
        </div>

        <!-- Blog Grid -->
        <div class="blog-grid">
            <a href="pythonblogs/pythonhub.html" class="blog-card">
                <div class="blog-icon">🐍</div>
                <h3>Python</h3>
                <p>What im doing in python</p>
            </a>

            <a href="rustblogs/rusthub.html" class="blog-card">
                <div class="blog-icon">🦀</div>
                <h3>Learning Rust</h3>
                <p>My journey into Rust</p>
            </a>

            <a href="lifeupdates/lifehub.html" class="blog-card">
                <div class="blog-icon">🌱</div>
                <h3>Whats going in in life</h3>
                <p>Life updates</p>
            </a>
        </div>

    </div>

    <script>
        fetch("../navbar.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Navbar request failed: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            })
            .catch(error => console.error(error));
    </script>

</body>

</html>
