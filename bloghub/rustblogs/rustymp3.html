    <div id="navbar"></div>

    <!-- Blog Post Container -->
    <article class="blog-post-container">
        <!-- Post Header -->
        <header class="post-header">
            <a href="rust-blog.html" class="back-link">← Back to Rust Blog</a>
            <h1 class="post-title">Mp3</h1>

            <a href="rusthub.html" class="back-link">← Back to Rust Blog</a>
        </footer>

    <script>
        fetch("/navbar.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Navbar request failed: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            })
            .catch(error => console.error(error));
    </script>
